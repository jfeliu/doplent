# Daily pg_dump of the Supabase database, encrypted and pushed to a private
# Google Drive folder (this repo is public, so workflow artifacts are not a
# private destination). See docs/backup-setup.md for the four secrets this
# needs and how to restore.

name: Database backup
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch: {}

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Dump and upload to Drive
    runs-on: ubuntu-latest
    if: github.repository == 'jfeliu/doplent'
    steps:
      - name: Dump, compress, encrypt
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          : "${SUPABASE_DB_URL:?missing SUPABASE_DB_URL secret}"
          : "${BACKUP_PASSPHRASE:?missing BACKUP_PASSPHRASE secret}"

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          out="doplent-${stamp}.sql.gz.gpg"

          umask 077
          pp="$(mktemp)"
          printf '%s' "$BACKUP_PASSPHRASE" > "$pp"

          # pg_dump from a pinned image so the client is never older than the
          # Supabase server (an older pg_dump refuses to dump a newer server).
          # The connection string is passed as an env var, never on argv.
          docker run --rm -e PGURL="$SUPABASE_DB_URL" postgres:17-alpine \
            sh -c 'exec pg_dump --no-owner --no-privileges "$PGURL"' \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 \
                  --pinentry-mode loopback --passphrase-file "$pp" \
                  --output "$out"

          rm -f "$pp"
          ls -lh "$out"
          echo "out=$out" >> "$GITHUB_ENV"

      - name: Ensure rclone
        # The runner image usually already ships rclone; fall back to apt (an
        # Azure-hosted mirror) rather than downloads.rclone.org, which has timed
        # out from CI.
        run: |
          if ! command -v rclone >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq rclone
          fi
          rclone version | head -1

      - name: Upload to Google Drive and prune old backups
        # Personal Gmail accounts can't use a service account here (service
        # accounts have no Drive storage quota, and shared drives need Google
        # Workspace) — so this authenticates as your own account with an OAuth
        # token generated once by `rclone authorize "drive"`. Files are owned by
        # you and count against your 15 GB.
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          : "${RCLONE_CONFIG_GDRIVE_TOKEN:?missing GDRIVE_TOKEN secret}"
          : "${RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID:?missing GDRIVE_FOLDER_ID secret}"

          rclone copy --no-traverse "$out" gdrive:
          rclone delete --min-age 365d gdrive:
          echo "--- current contents ---"
          rclone lsl gdrive:
