# fly.toml app configuration file generated for doplent on 2026-08-19T23:33:03+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'doplent'
primary_region = 'ams'
console_command = '/code/manage.py shell'

[build]
[deploy]
  release_command = 'python manage.py migrate --noinput'

[env]
  DJANGO_DEBUG = 'False'
  PORT = '8000'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
