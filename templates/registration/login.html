{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Log in" %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-calendar2-check text-primary" style="font-size:2rem;"></i>
          <h1 class="h4 mt-2 mb-1">{% translate "Log in" %}</h1>
          <p class="text-muted small mb-0">{% translate "Substitutions" %}</p>
        </div>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary w-100 mt-2">{% translate "Log in" %}</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
